name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --features cli
      - run: cargo test --locked --profile release-test
      - name: Verify documentation references
        run: |
          rustc tools/audit-doc-links.rs -o /tmp/rusqsieve-audit-doc-links
          /tmp/rusqsieve-audit-doc-links
      - name: Compile and run the C ABI smoke test
        run: make c-api-smoke

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: make wasm
      - run: ./build-release.sh wasm32-unknown-unknown

  slow-factorization:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --profile release-test --test factorization -- --ignored
